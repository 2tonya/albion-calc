<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albion Online — Калькулятор крафта</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <h2 class="logo">⚒️ Albion Calc</h2>
        <nav>
            <div class="menu-category active">📦 Материалы</div>
            <div class="menu-sub active">— Изысканные</div>
            <div class="menu-sub">— Разное (Misc)</div>
            <div class="menu-sub">— Энергия Авалона</div>
            <div class="menu-category">🎣 Рыбалка</div>
            <div class="menu-category">👢 Обувь</div>
            <div class="menu-category">🧥 Доспехи</div>
            <div class="menu-category">⚔️ Оружие</div>
        </nav>
    </aside>

    <main class="main-content">
        <h1>Калькулятор крафта</h1>

        <!-- Город и бонус -->
        <div class="city-select">
            <label>Город (бонус RRR):</label>
            <select id="city">
                <option value="0">Без бонуса (0%)</option>
                <option value="15.2">Лимхерст (15.2%)</option>
                <option value="15.2">Мартлок (15.2%)</option>
                <option value="15.2">Тетфорд (15.2%)</option>
                <option value="15.2">Форт Стерлинг (15.2%)</option>
                <option value="15.2">Бриджуотч (15.2%)</option>
                <option value="24.8">Кэрлеон (24.8%)</option>
            </select>
        </div>

        <!-- Ресурсы -->
        <div class="resources-grid">
            <div class="resource-row">
                <span class="icon">🪨</span>
                <input type="number" id="ore" placeholder="Цена руды (за шт)" tabindex="1">
            </div>
            <div class="resource-row">
                <span class="icon">🧵</span>
                <input type="number" id="cloth" placeholder="Цена ткани (за шт)" tabindex="2">
            </div>
            <div class="resource-row">
                <span class="icon">🪵</span>
                <input type="number" id="wood" placeholder="Цена дерева (за шт)" tabindex="3">
            </div>
            <div class="resource-row">
                <span class="icon">🦴</span>
                <input type="number" id="leather" placeholder="Цена кожи (за шт)" tabindex="4">
            </div>
        </div>

        <!-- Настройки крафта -->
        <div class="settings">
            <label><input type="checkbox" id="focus"> Использовать фокус (+30% RRR)</label>
        </div>

        <div class="settings-row">
            <div class="setting-field">
                <label>Ставка станции (Tax, %):</label>
                <input type="number" id="taxRate" value="150" min="0" placeholder="Например: 150">
                <span class="hint">Устанавливает владелец станции</span>
            </div>
            <div class="setting-field">
                <label>Базовая стоимость (Item Value):</label>
                <input type="number" id="itemValue" value="54" min="0" placeholder="Скрытый параметр игры">
                <span class="hint">Можно найти в справочниках</span>
            </div>
        </div>

        <!-- Цена предмета -->
        <div class="item-price">
            <label>Цена предмета на рынке:</label>
            <input type="number" id="itemPrice" placeholder="В серебре">
        </div>

        <!-- Кнопка -->
        <button id="calculate">Рассчитать</button>

        <!-- Результаты -->
        <div class="results" id="results" style="display: none;">
            <div class="result-card">
                <span class="label">Стоимость материалов</span>
                <span class="value" id="materialsCost">0</span>
            </div>
            <div class="result-card">
                <span class="label">Плата за станцию</span>
                <span class="value" id="stationFeeDisplay">0</span>
            </div>
            <div class="result-card">
                <span class="label">Себестоимость (с RRR)</span>
                <span class="value" id="costValue">0</span>
            </div>
            <div class="result-card">
                <span class="label">Чистая прибыль</span>
                <span class="value" id="profitValue">0</span>
            </div>
            <div class="result-card">
                <span class="label">Маржа</span>
                <span class="value" id="marginValue">0%</span>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
